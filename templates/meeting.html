<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>{{.Slug}} · Reunión</title>
	<link rel="stylesheet" href="{{asset "app.css"}}" />
	<script src="https://8x8.vc/{{.AppID}}/external_api.js"></script>
	<script src="{{asset "meeting.js"}}" defer></script>
</head>
<body class="meeting">
	<div class="brand-overlay" aria-label="Transgenia: IA aplicada"><img src="{{asset "transgenia-logo-alt.png"}}" alt="Transgenia" width="146" height="32" /><span>IA aplicada</span></div>
	<div id="meet" data-app-id="{{.AppID}}" data-room="{{.Slug}}" data-jwt="{{.JWT}}" data-name="{{.DisplayName}}"
		data-moderator="{{.IsModerator}}" data-csrf="{{.CSRF}}" data-capture="{{.Capture}}"></div>
</body>
</html>
