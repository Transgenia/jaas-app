<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<title>{{.Slug}} · Reuniones Transgenia</title>
	<link rel="stylesheet" href="/static/app.css" />
	<script src="/static/join.js" defer></script>
</head>
<body>
	<div class="center">
		<div class="card">
			<img class="logo" src="/static/logo.svg" alt="Transgenia" />
			<h1>{{.Slug}}</h1>
			<p class="sub">Escribe tu nombre para entrar a la reunión.</p>
			{{with .Error}}<p class="error">{{.}}</p>{{end}}
			<form method="POST" action="/m/{{.Slug}}/join">
				<input type="hidden" name="form_token" value="{{.FormToken}}" />
				<label for="display_name">Tu nombre</label>
				<input type="text" id="display_name" name="display_name" required maxlength="80" autofocus autocomplete="name" />
				<button type="submit" class="block">Entrar a la reunión</button>
				<p class="foot"><button type="button" id="host-toggle" class="linklike">¿Eres el anfitrión?</button></p>
				<div id="host-section" class="{{if not .HostOpen}}hidden{{end}}">
					<label for="host_password">Contraseña de anfitrión</label>
					<input type="password" id="host_password" name="host_password" autocomplete="current-password" />
				</div>
			</form>
		</div>
	</div>
</body>
</html>
